<!-- Modale "Ajouter une photo", ouverte depuis le bouton correspondant dans une popup de
     terrain sans photo (voir brancherPhotosPopup dans script.js). Structure calquée sur
     #share-panel/#share-overlay ci-dessus. -->
<div id="add-photo-overlay"></div>
<div id="add-photo-modal">
    <button id="add-photo-close" data-i18n-aria="close_panel">✕</button>
    <p class="add-photo-title" data-i18n="add_photo_modal_title">Ajouter une photo</p>
    <p id="add-photo-terrain-name" class="add-photo-terrain-name"></p>

    <div id="add-photo-form-zone">
        <!-- Emplacement réservé : le vrai formulaire (Forminit) sera intégré ici une fois configuré. -->
        <form id="add-photo-form" class="add-photo-form" enctype="multipart/form-data">
            <input type="hidden" name="fi-text-terrain-osm-id" value="">
            <input type="hidden" name="fi-text-terrain-nom" value="">
            <input type="hidden" name="fi-text-terrain-lien-osm" value="">

            <p class="add-photo-tip"><strong data-i18n="add_photo_tip_label">Astuce :</strong> <span data-i18n="add_photo_tip">Prenez votre photo au format paysage (téléphone à l'horizontale), pour coller au format des photos Mapillary.</span> <a href="https://www.mapillary.com" target="_blank" rel="noopener" data-i18n="add_photo_tip_link">En savoir plus sur Mapillary</a></p><label class="add-photo-field-label" data-i18n="add_photo_field_photo_label">Votre photo</label>
            <input type="file" name="fi-file-photo" accept="image/*" required class="add-photo-file-input">
            <span class="add-photo-file-hint" data-i18n="add_photo_file_hint">20 Mo maximum</span>

            <label class="add-photo-field-label" data-i18n="add_photo_field_email_label">Votre e-mail (facultatif, pour vous recontacter si besoin)</label>
            <input type="email" name="fi-sender-email" class="add-photo-text-input">

            <label class="add-photo-checkbox-row">
                <input type="checkbox" name="fi-checkbox-autorisation-mapillary" required>
                <span data-i18n="add_photo_checkbox_label">J'autorise Mapetanque.be à publier cette photo sur Mapillary sous licence CC BY-SA (avec mention de mon prénom/pseudo si je le renseigne ci-dessus).</span>
            </label>

            <input type="hidden" name="_gotcha" style="display:none !important">

            <button type="submit" class="add-photo-submit-btn" data-i18n="add_photo_submit_btn">Envoyer la photo</button>
        </form>

        <p id="add-photo-status" class="add-photo-status" role="status"></p>
    </div>
</div>
