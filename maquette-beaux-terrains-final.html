<title>Maquette — Les plus beaux terrains (miniatures + géoloc)</title>
<!-- Chemins absolus depuis la racine du site : à tester avec Live Server ouvert SUR LA RACINE DU
     DÉPÔT (pas sur le dossier du fichier), pour que /style.css, /images/... etc. se résolvent.
     Plus de <base href> : les vraies miniatures sont locales, donc plus besoin de pointer vers
     le site en ligne. -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/style-chargeur-photo.css">
<style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f2; color: #333; }

    .demo-bar {
        position: sticky; top: 0; z-index: 50;
        background: #222; color: #fff; padding: 8px 16px; font-size: 13px;
        display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    }
    .demo-bar button {
        font-family: inherit; font-size: 13px; padding: 5px 12px; border-radius: 20px;
        border: 1px solid #555; background: #333; color: #fff; cursor: pointer;
    }
    .demo-bar button.active { background: #74C15A; border-color: #74C15A; color: #1a1a1a; font-weight: bold; }
    .demo-note { margin-left: auto; opacity: .6; }

    .demo-page-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

    /* ============ Section "Les plus beaux terrains" ============ */
    /* Version page d'accueil : titre centré, comme .provinces-container h2 ("Parcourir par
       province"). Sur les pages région, on remplacera par la variante alignée à gauche
       (.province-communes-section h2, cf. maquette-page-region.html). */
    #beaux-terrains h2 { margin: 0 0 24px; font-size: 26px; color: #333; text-align: center; }

    .beaux-terrains-carrousel { position: relative; }

    .tuiles-scroller {
        display: flex; overflow-x: auto; padding: 4px 0 16px;
        scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        scrollbar-width: none;
    }
    .tuiles-scroller::-webkit-scrollbar { display: none; }

    /* Écart géré par margin-right plutôt que par `gap` : ce dernier n'est arrivé dans
       Safari qu'en 14.1, et la marge donne exactement le même résultat partout. */
    .tuile-terrain {
        flex: 0 0 300px; width: 300px; scroll-snap-align: start;
        margin-right: 16px;
        cursor: pointer; transition: transform 0.15s ease;
    }
    .tuile-terrain:last-child { margin-right: 0; }

    /* ---- Flèches de défilement ----
       Réservées aux écrans larges AVEC survol réel : sur tactile (iPad, mobile) il n'y a pas de
       survol, et le doigt suffit — on y garde donc les tuiles partiellement coupées, qui
       indiquent d'elles-mêmes qu'on peut faire défiler. */
    .carrousel-fleche { display: none; }

    @media (min-width: 1025px) and (hover: hover) {
        /* La largeur des tuiles (4 pleines, pile dans le cadre) est posée en JS : voir
           ajusterLargeurTuiles(). Un calc() en flex-basis donne des résultats variables
           d'un moteur à l'autre. */
        .carrousel-fleche {
            position: absolute;
            /* La zone s'étend sur la bande photo uniquement (le bas correspond au bloc de
               texte + le padding bas du scroller), et le bouton s'y centre verticalement :
               ça reste juste quelle que soit la largeur des tuiles. */
            top: 4px; bottom: 86px;
            width: 46px;
            display: flex; align-items: center; justify-content: center;
            border: 0; padding: 0; margin: 0; background: none; cursor: pointer;
            opacity: 0; transition: opacity 0.15s ease;
            z-index: 3;
        }
        .carrousel-fleche.prev { left: -14px; }
        .carrousel-fleche.next { right: -14px; }

        .beaux-terrains-carrousel:hover .carrousel-fleche,
        .carrousel-fleche:focus-visible { opacity: 1; }

        /* Masquée quand il n'y a plus rien à faire défiler de ce côté. */
        .carrousel-fleche[hidden] { display: none; }

        .carrousel-fleche span {
            width: 40px; height: 40px; border-radius: 50%;
            background: #fff; border: 1px solid #e2e6de;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px; color: #444;
        }
        .carrousel-fleche:hover span { border-color: #74C15A; color: #4a8f36; }
    }
    .tuile-terrain:hover { transform: translateY(-2px); }
    .tuile-terrain:hover .tuile-photo { box-shadow: 0 6px 18px rgba(30,50,20,0.18); }

    /* Miniature carrée pré-générée : plus d'iframe Mapillary ici, donc plus d'habillage
       Mapillary, plus d'attente de chargement, et un défilement fluide. */
    /* Carré obtenu via padding-bottom:100% (compatible partout) plutôt que aspect-ratio,
       et contenu positionné en absolu par-dessus. */
    .tuile-photo {
        width: 100%; height: 0; padding-bottom: 100%;
        border-radius: 12px; overflow: hidden; background: #eceee9;
        position: relative; z-index: 1;
    }
    .tuile-photo img,
    .tuile-photo-placeholder {
        position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .tuile-photo img { object-fit: cover; display: block; }
    .tuile-photo-placeholder {
        display: flex; align-items: center; justify-content: center;
        color: #8a9a7c; font-size: 12px; background: #e9efe4;
    }

    .tuile-info { padding: 10px 2px 12px; }
    .tuile-nom {
        font-size: 15px; font-weight: bold; color: #222; margin: 0 0 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tuile-terrain .popup-breadcrumb {
        margin-bottom: 2px; font-size: 12.5px; color: #4a8f36;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tuile-extrait {
        font-size: 12.5px; color: #666; margin: 0;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Nouvelle classe à ajouter dans style.css : zone de description dans la fiche terrain,
       affichée uniquement si le terrain a un texte (sinon l'élément n'est pas créé du tout). */
    .popup-description { font-size: 13.5px; color: #444; line-height: 1.5; margin: 4px 0 10px; }

    @media (max-width: 640px) {
        .tuile-terrain { flex-basis: 240px; width: 240px; }
    }
</style>

// complète ("en Belgique"), et se restreint à la région dès que la réponse arrive (~100-300 ms).
// Aucune permission demandée à l'usager (contrairement au GPS du bouton "Me localiser").
// En cas d'échec, de quota dépassé, de visiteur hors Belgique ou de région non reconnue :
// on reste simplement sur la Belgique entière — jamais d'erreur visible.
var URL_GEO_IP = "https://ipapi.co/json/";

// Les API IP renvoient des libellés variables ("Flanders", "Vlaanderen", "Wallonia", "Brussels
// Capital"...) et parfois une province plutôt qu'une région : on normalise les deux.
var REGION_PAR_LIBELLE = {
    "flanders": "Flandre", "vlaanderen": "Flandre", "flandre": "Flandre",
    "flemish region": "Flandre", "vlaams gewest": "Flandre",
    "wallonia": "Wallonie", "wallonie": "Wallonie", "walloon region": "Wallonie",
    "region wallonne": "Wallonie", "waals gewest": "Wallonie",
    "brussels": "Bruxelles", "brussels capital": "Bruxelles", "bruxelles": "Bruxelles",
    "brussels capital region": "Bruxelles", "brussels-capital region": "Bruxelles",
    "brussels hoofdstedelijk gewest": "Bruxelles",
    // Provinces, au cas où l'API renvoie ce niveau-là
    "antwerp": "Flandre", "antwerpen": "Flandre", "anvers": "Flandre",
    "east flanders": "Flandre", "oost-vlaanderen": "Flandre",
    "west flanders": "Flandre", "west-vlaanderen": "Flandre",
    "flemish brabant": "Flandre", "vlaams-brabant": "Flandre",
    "limburg": "Flandre", "limbourg": "Flandre",
    "hainaut": "Wallonie", "henegouwen": "Wallonie",
    "liege": "Wallonie", "liège": "Wallonie", "luik": "Wallonie",
    "namur": "Wallonie", "namen": "Wallonie",
    "luxembourg": "Wallonie",
    "walloon brabant": "Wallonie", "brabant wallon": "Wallonie", "waals-brabant": "Wallonie"
};

function normaliser(texte) {
    return (texte || "").toString().trim().toLowerCase();
}

function regionDepuisReponse(donnees) {
    // Hors Belgique : on ne restreint pas (le visiteur peut très bien préparer un voyage).
    if (normaliser(donnees.country_code) !== "be") return "";
    var candidats = [donnees.region, donnees.region_code, donnees.city];
    for (var i = 0; i < candidats.length; i++) {
        var trouve = REGION_PAR_LIBELLE[normaliser(candidats[i])];
        if (trouve) return trouve;
    }
    return "";
}

function detecterRegion() {
    return fetch(URL_GEO_IP, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) { return d ? regionDepuisReponse(d) : ""; })
        .catch(function () { return ""; });
}

// =====================================================================================
// Rendu
// =====================================================================================
var regionCourante = "";   // "" = Belgique entière

function terrainsAffiches() {
    if (!regionCourante) return TERRAINS;
    return TERRAINS.filter(function (t) { return t.region === regionCourante; });
}

function premiersMots(texte, nbMots) {
    var mots = texte.trim().split(/\s+/);
    if (mots.length <= nbMots) return texte;
    return mots.slice(0, nbMots).join(" ") + "…";
}

// Bruxelles est à la fois région et "province" dans les données : on n'affiche pas deux fois
// le même niveau ("Bruxelles › Bruxelles › Anderlecht" -> "Bruxelles › Anderlecht").
function filAriane(t) {
    var niveaux = [t.region];
    if (t.province && t.province !== t.region) niveaux.push(t.province);
    niveaux.push(t.commune);
    return niveaux.map(echapper).join(' <span class="sep">&rsaquo;</span> ');
}

function echapper(texte) {
    return (texte || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function majTitre() {
    document.getElementById("beaux-terrains-titre").textContent =
        "Les plus beaux terrains " + LIBELLE_REGION[regionCourante];
}

var scroller = document.getElementById("tuiles-scroller");

function construireTuiles() {
    var items = terrainsAffiches();

    // Une région sans terrain sélectionné : on masque toute la section plutôt que d'afficher
    // une rangée vide.
    document.getElementById("beaux-terrains").style.display = items.length ? "" : "none";
    if (!items.length) return;

    var html = "";
    for (var i = 0; i < items.length; i++) {
        var t = items[i];
        var photo = t.miniature
            ? '<img src="' + echapper(t.miniature) + '" alt="" loading="lazy" width="500" height="500">'
            : '<div class="tuile-photo-placeholder">photo à venir</div>';
        var extrait = t.description
            ? '<p class="tuile-extrait">' + echapper(premiersMots(t.description, 8)) + '</p>'
            : "";
        html +=
            '<div class="tuile-terrain" data-index="' + i + '" role="button" tabindex="0">' +
            '  <div class="tuile-photo">' + photo + '</div>' +
            '  <div class="tuile-info">' +
            '    <p class="tuile-nom">' + echapper(t.nom) + '</p>' +
            '    <div class="popup-breadcrumb">' + filAriane(t) + '</div>' +
            '    ' + extrait +
            '  </div>' +
            '</div>';
    }
    scroller.innerHTML = html;
    scroller.scrollLeft = 0;
    ajusterLargeurTuiles();
    majFleches();

    var tuiles = scroller.querySelectorAll(".tuile-terrain");
    for (var j = 0; j < tuiles.length; j++) {
        (function (tuile) {
            function ouvrir() { ouvrirTerrain(items[parseInt(tuile.getAttribute("data-index"), 10)]); }
            tuile.addEventListener("click", ouvrir);
            tuile.addEventListener("keydown", function (e) {
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrir(); }
            });
        })(tuiles[j]);
    }
}

// ---- Flèches de défilement (écrans larges avec survol ; cf. media query CSS) ----
// Un clic fait défiler d'une "page" = la largeur visible, soit exactement 4 tuiles quand la
// media query est active. On masque la flèche du côté où il n'y a plus rien à atteindre.
var carrousel = document.getElementById("beaux-terrains-carrousel");
var flechePrev, flecheNext;

function creerFleches() {
    flechePrev = document.createElement("button");
    flechePrev.type = "button";
    flechePrev.className = "carrousel-fleche prev";
    flechePrev.setAttribute("aria-label", "Voir les terrains précédents");
    flechePrev.innerHTML = "<span>&lsaquo;</span>";

    flecheNext = document.createElement("button");
    flecheNext.type = "button";
    flecheNext.className = "carrousel-fleche next";
    flecheNext.setAttribute("aria-label", "Voir les terrains suivants");
    flecheNext.innerHTML = "<span>&rsaquo;</span>";

    flechePrev.addEventListener("click", function () { defiler(-1); });
    flecheNext.addEventListener("click", function () { defiler(1); });

    carrousel.appendChild(flechePrev);
    carrousel.appendChild(flecheNext);

    scroller.addEventListener("scroll", majFleches);
    window.addEventListener("resize", function () { ajusterLargeurTuiles(); majFleches(); });
}

// Sur écran large avec survol : 4 tuiles pleines qui remplissent exactement la largeur
// disponible (rien de coupé). Ailleurs : largeur fixe du CSS, avec une tuile partiellement
// visible qui indique qu'on peut faire défiler au doigt.
var MQ_DESKTOP = window.matchMedia ? window.matchMedia("(min-width: 1025px) and (hover: hover)") : null;
var TUILES_PAR_VUE = 4;
var GAP = 16;

function ajusterLargeurTuiles() {
    var tuiles = scroller.querySelectorAll(".tuile-terrain");
    var desktop = MQ_DESKTOP && MQ_DESKTOP.matches;
    var largeur = desktop
        ? Math.floor((scroller.clientWidth - GAP * (TUILES_PAR_VUE - 1)) / TUILES_PAR_VUE)
        : null;
    for (var i = 0; i < tuiles.length; i++) {
        if (largeur) {
            tuiles[i].style.flex = "0 0 " + largeur + "px";
            tuiles[i].style.width = largeur + "px";
        } else {
            tuiles[i].style.flex = "";
            tuiles[i].style.width = "";
        }
    }
}

function defiler(sens) {
    scroller.scrollLeft += sens * scroller.clientWidth;
}

function majFleches() {
    if (!flechePrev) return;
    var max = scroller.scrollWidth - scroller.clientWidth;
    // Marge de 4px : les navigateurs arrondissent parfois scrollLeft, la flèche resterait
    // sinon visible alors qu'on est déjà tout au bout.
    flechePrev.hidden = scroller.scrollLeft <= 4;
    flecheNext.hidden = scroller.scrollLeft >= max - 4;
}

function afficher() {
    majTitre();
    construireTuiles();
}

// =====================================================================================
// Ouverture de la fiche terrain
// =====================================================================================
// DÉMO : reconstruit ici un contenu de fiche proche du vrai. Sur le site, cette fonction sera
// remplacée par un recentrage de la carte + ouverture de la vraie popup Leaflet du terrain
// (voir les explications accompagnant cette maquette).
var SEUIL_MOBILE = 1024;

function construireFicheDemo(t) {
    var photo = t.miniature
        ? '<img src="' + echapper(t.miniature) + '" alt="" class="popup-photo" loading="lazy">'
        : '<img src="/images/pas-de-photo.webp" alt="" class="popup-photo popup-photo-placeholder" loading="lazy">';
    // Zone de description : créée uniquement si le terrain a un texte.
    var description = t.description ? '<p class="popup-description">' + echapper(t.description) + '</p>' : '';
    return '' +
        '<div class="popup-breadcrumb">' + filAriane(t) + '</div>' +
        '<b>' + echapper(t.nom) + '</b><br><br>' +
        photo +
        '<button type="button" class="popup-photo-add-btn">Ajouter une photo ?</button><br>' +
        description +
        '<span class="popup-icon">🔓</span> Accès : probablement libre<br><br>' +
        '<a href="https://www.google.com/maps/dir/?api=1&destination=' + t.lat + ',' + t.lon + '" target="_blank" rel="noopener" class="popup-action-link">' +
        '<span class="popup-link-text">Afficher l\'itinéraire</span></a>';
}

function ouvrirTerrain(t) {
    var mobile = window.innerWidth <= SEUIL_MOBILE;
    var panneau = document.getElementById(mobile ? "mobile-sheet" : "desktop-modal");
    var conteneur = document.getElementById(mobile ? "mobile-sheet-content" : "desktop-modal-content");
    var overlay = document.getElementById(mobile ? "mobile-sheet-overlay" : "desktop-modal-overlay");
    conteneur.innerHTML = construireFicheDemo(t);
    panneau.classList.add("open");
    overlay.classList.add("visible");
}

function fermerFiche() {
    document.getElementById("mobile-sheet").classList.remove("open");
    document.getElementById("mobile-sheet-overlay").classList.remove("visible");
    document.getElementById("desktop-modal").classList.remove("open");
    document.getElementById("desktop-modal-overlay").classList.remove("visible");
}
document.getElementById("mobile-sheet-close").addEventListener("click", fermerFiche);
document.getElementById("mobile-sheet-overlay").addEventListener("click", fermerFiche);
document.getElementById("desktop-modal-close").addEventListener("click", fermerFiche);
document.getElementById("desktop-modal-overlay").addEventListener("click", fermerFiche);

// =====================================================================================
// Démarrage
// =====================================================================================
// 1) Affichage immédiat, Belgique entière : rien n'attend le réseau.
creerFleches();
afficher();

// 2) Puis restriction à la région si la géoloc IP aboutit.
var modeAuto = true;
detecterRegion().then(function (region) {
    if (!modeAuto) return;   // l'utilisateur a forcé une région entre-temps (barre de test)
    if (region) { regionCourante = region; afficher(); }
});

// ---- Barre de test (à supprimer lors de l'intégration) ----
var boutons = document.querySelectorAll(".demo-bar button");
for (var k = 0; k < boutons.length; k++) {
    (function (b) {
        b.addEventListener("click", function () {
            for (var m = 0; m < boutons.length; m++) boutons[m].classList.remove("active");
            b.classList.add("active");
            var val = b.getAttribute("data-region");
            if (val === "auto") {
                modeAuto = true;
                regionCourante = "";
                afficher();
                detecterRegion().then(function (r) { if (modeAuto && r) { regionCourante = r; afficher(); } });
            } else {
                modeAuto = false;
                regionCourante = val;
                afficher();
            }
        });
    })(boutons[k]);
}
</script>

</body>
</html>
