<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Page écrite par scripts/generer_carte.py à partir de templates/carte_template.html :
         modifier le gabarit, puis relancer le script (les quatre langues sont réécrites). -->
    <title>Map of pétanque courts in Belgium — Mapetanque.be</title>
    <meta name="description" id="meta-description" content="Interactive map of public pétanque courts in Belgium: search for a town or address, or locate yourself, and browse the list of courts around you.">
    <link rel="icon" type="image/svg+xml" href="/images/mapetanque-boule-pleine.svg">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="apple-mobile-web-app-title" content="Mapetanque">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Map of pétanque courts in Belgium — Mapetanque.be">
    <meta property="og:description" content="Interactive map of public pétanque courts in Belgium: search for a town or address, or locate yourself, and browse the list of courts around you.">
    <meta property="og:image" content="https://mapetanque.be/images/mapetanque-partage.png?v=2">
    <meta property="og:url" content="https://mapetanque.be/en/carte.html">
    <meta property="og:type" content="website">

    <link rel="canonical" href="https://mapetanque.be/en/carte.html">
    <link rel="alternate" hreflang="fr" href="https://mapetanque.be/carte.html">
    <link rel="alternate" hreflang="nl" href="https://mapetanque.be/nl/carte.html">
    <link rel="alternate" hreflang="de" href="https://mapetanque.be/de/carte.html">
    <link rel="alternate" hreflang="en" href="https://mapetanque.be/en/carte.html">
    <link rel="alternate" hreflang="x-default" href="https://mapetanque.be/carte.html">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/lib/leaflet-1.9.4/leaflet.css" />
    <link rel="stylesheet" href="/lib/leaflet.markercluster-1.5.3/MarkerCluster.css" />
    <link rel="stylesheet" href="/lib/leaflet.markercluster-1.5.3/MarkerCluster.Default.css" />
    <!-- Fond « Plan » vectoriel (OpenFreeMap Bright), dessiné sous la carte Leaflet par MapLibre -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/style-chargeur-photo.css">
    <link rel="stylesheet" href="/style-ombres.css">
    <!-- En-tête sans bannière photo des pages de contenu -->
    <link rel="stylesheet" href="/style-entete-sobre.css">
    <!-- Fiche des terrains (fenêtre flottante, panneau mobile) -->
    <link rel="stylesheet" href="/style-beaux-terrains.css">
    <!-- Tuiles des terrains, les mêmes que sur les pages commune -->
    <link rel="stylesheet" href="/style-commune.css">
    <!-- Mise en page de la carte plein écran et de sa liste -->
    <link rel="stylesheet" href="/style-carte.css">
    <!-- Données structurées schema.org (Google, IA) : écrites par scripts/generer_referencement.py, ne pas modifier à la main. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebPage",
          "@id": "https://mapetanque.be/en/carte.html#page",
          "url": "https://mapetanque.be/en/carte.html",
          "name": "Map of pétanque courts in Belgium",
          "description": "Interactive map of public pétanque courts in Belgium: search for a town or address, or locate yourself, and browse the list of courts around you.",
          "inLanguage": "en",
          "isPartOf": {
            "@id": "https://mapetanque.be/#site"
          },
          "primaryImageOfPage": "https://mapetanque.be/images/mapetanque-partage.png?v=2"
        }
      ]
    }
    </script>
</head>

<body class="page-carte">

<div class="entete-sobre carte-entete">

<div class="header">

    <div class="header-top-row">
        <a href="/en/" class="brand-link">
            <picture>
                <source media="(max-width: 1024px)" srcset="/images/mapetanque-boule-pleine.svg" width="32" height="32">
                <img src="/images/mapetanque-logo-fonce.svg" class="logo" width="196" height="34" alt="Mapetanque">
            </picture>
        </a>

        <!-- Recherche : mêmes propositions que sur l'accueil (« Propositions de la recherche »
             dans script.js), mais tout s'affiche ici, sur la carte. -->
        <form id="searchForm" class="search-form carte-recherche">
            <input
                type="text"
                id="searchInput"
                data-i18n-placeholder="search_placeholder"
                placeholder="Address, town, region..."
                autocomplete="off"
            >
            <button type="submit" id="searchBtn" aria-label="Search" data-i18n-aria="signalement_search_btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
        </form>

        <!-- « Me localiser », à droite de la recherche -->
        <button id="locateBtn" class="carte-localiser" aria-label="Locate me" data-i18n-aria="locate_btn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span data-i18n="locate_btn">Locate me</span>
        </button>

        <!-- Navigation de l'ordinateur : construite par construireNavBureau() dans script.js -->
        <div class="header-nav-group"></div>

        <button id="menu-button" aria-label="Menu" data-i18n-aria="open_menu">
            <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
    </div>

</div><!-- /.header -->

</div><!-- /.entete-sobre -->

<!-- Menu mobile : rempli par construireMenu() dans script.js -->
<nav id="side-menu"></nav>
<div id="menu-overlay"></div>

<!-- Carte plein écran et liste des terrains de la zone affichée (carte.js). Sur ordinateur, la
     liste est à gauche de la carte ; sur téléphone, c'est une feuille qui monte du bas de l'écran
     (aperçu, repliée ou dépliée), comme sur Komoot. -->
<main class="carte-corps">

    <aside id="carte-liste" class="carte-liste" aria-label="Courts in the area shown">
        <!-- Poignée de la feuille (téléphone) : à glisser ou à toucher -->
        <div class="carte-liste-poignee" aria-hidden="true"></div>
        <div class="carte-liste-entete">
            <p class="carte-liste-compte" aria-live="polite">
                <span id="carte-liste-compte"></span>
                <span id="carte-liste-lieux" class="carte-liste-lieux"></span>
            </p>
        </div>
        <div id="carte-liste-tuiles" class="carte-liste-tuiles"></div>
        <button type="button" id="carte-liste-plus" class="carte-liste-plus" data-i18n="carte_liste_plus" hidden>Show more courts</button>
        <p class="carte-liste-signaler">
            <a href="/en/a-propos.html#contact" id="signaler-terrain-link" data-i18n="signalement_link">Report a missing court</a>
        </p>
    </aside>

    <div class="map-view">
        <div class="map-wrapper">
            <div id="map"></div>

            <!-- Pastilles de filtres et des clubs, remplies par script.js (« Pastilles de la carte ») -->
            <div id="carte-pastilles" class="carte-pastilles"></div>

            <p id="searchError" class="search-error" role="status"></p>

        </div>
    </div>

</main>

<!-- Panneau de partage réutilisable (site ou terrain précis) -->
<div id="share-overlay"></div>

<!-- Fiche terrain : panneau plein écran sur mobile, fenêtre flottante sur ordinateur (voir
     ouvrirFicheMobileTerrain()/fermerFicheMobileTerrain() dans script.js). -->
<div id="mobile-sheet-overlay"></div>
<div id="mobile-sheet">
    <button id="mobile-sheet-close" aria-label="Close" data-i18n-aria="close_panel">&#10005;</button>
    <div id="mobile-sheet-content"></div>
</div>

<div id="desktop-modal-overlay"></div>
<div id="desktop-modal">
    <button id="desktop-modal-close" aria-label="Close" data-i18n-aria="close_panel">&#10005;</button>
    <div id="desktop-modal-content"></div>
</div>

<div id="share-panel">
    <button id="share-close" data-i18n-aria="close_panel">✕</button>
    <p id="share-title" class="share-title"></p>

    <div class="share-links">
        <a id="share-whatsapp" class="share-link" target="_blank" rel="noopener">
            <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></span><span data-i18n="share_whatsapp">WhatsApp</span>
        </a>
        <a id="share-facebook" class="share-link" target="_blank" rel="noopener">
            <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></span><span data-i18n="share_facebook">Facebook</span>
        </a>
        <a id="share-twitter" class="share-link" target="_blank" rel="noopener">
            <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span><span data-i18n="share_twitter">X (Twitter)</span>
        </a>
        <a id="share-email" class="share-link">
            <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></span><span data-i18n="share_email">E-mail</span>
        </a>
        <button type="button" id="share-copy" class="share-link">
            <span class="share-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></span><span id="share-copy-label" data-i18n="share_copy">Copy link</span>
        </button>
    </div>
</div>

<!-- Modale « Ajouter une photo », ouverte depuis la fiche d'un terrain sans photo (voir
     brancherPhotosPopup dans script.js). -->
<div id="add-photo-overlay"></div>
<div id="add-photo-modal">
    <button id="add-photo-close" data-i18n-aria="close_panel">✕</button>
    <p class="add-photo-title" data-i18n="add_photo_modal_title">Add a photo</p>
    <p id="add-photo-terrain-name" class="add-photo-terrain-name"></p>

    <div id="add-photo-form-zone">
        <form id="add-photo-form" class="add-photo-form" enctype="multipart/form-data">
            <input type="hidden" name="fi-text-terrain-osm-id" value="">
            <input type="hidden" name="fi-text-terrain-nom" value="">
            <input type="hidden" name="fi-text-terrain-lien-osm" value="">

            <p class="add-photo-tip"><strong data-i18n="add_photo_tip_label">Tip:</strong> <span data-i18n="add_photo_tip">Take your photo in landscape orientation to match the format of</span> <a href="https://www.mapillary.com" target="_blank" rel="noopener" data-i18n="add_photo_tip_link">Mapillary</a></p><label class="add-photo-field-label" data-i18n="add_photo_field_photo_label">Your photo</label>
            <input type="file" name="fi-file-photo" accept="image/*" required class="add-photo-file-input">
            <span class="add-photo-file-hint" data-i18n="add_photo_file_hint">20 MB max per photo — you can select several</span>

            <label class="add-photo-field-label" data-i18n="add_photo_field_email_label">Your email (optional, in case we need to get back to you)</label>
            <input type="email" name="fi-sender-email" class="add-photo-text-input">

            <label class="add-photo-checkbox-row">
                <input type="checkbox" name="fi-checkbox-autorisation-mapillary" required>
                <span data-i18n="add_photo_checkbox_label">I allow Mapetanque.be to publish this photo on Mapillary under a CC BY-SA licence</span>
            </label>

            <input type="hidden" name="_gotcha" style="display:none !important">

            <button type="submit" class="add-photo-submit-btn" data-i18n="add_photo_submit_btn">Send photo</button>
        </form>

        <p id="add-photo-status" class="add-photo-status" role="status"></p>
    </div>
</div>

<script src="/lib/leaflet-1.9.4/leaflet.js"></script>
<script src="/lib/leaflet.markercluster-1.5.3/leaflet.markercluster.js"></script>
<!-- MapLibre et son module pour Leaflet : le fond « Plan » (voir STYLE_PLAN dans script.js). S'ils
     ne se chargent pas, la carte retombe sur les images d'OpenStreetMap. -->
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script src="/translations.js"></script>
<script src="/chargeur-photo.js"></script>
<script src="/boule-animee.js"></script>
<script src="/criteres.js"></script>
<script src="/script.js"></script>
<!-- Liste des terrains de la zone affichée et adresses de la page (?q=, ?commune=…) -->
<script src="/carte.js"></script>

</body>
</html>
