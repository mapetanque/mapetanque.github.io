name: Mise à jour hebdomadaire des terrains OSM

on:
  schedule:
    - cron: "17 3 * * 1"

  # À la demande : onglet Actions de GitHub, ou bouton « Mettre à jour depuis OSM »
  # de la page admin (via le Worker mapetanque-admin).
  workflow_dispatch:

permissions:
  contents: write

# Deux lancements rapprochés (horaire + bouton « Mettre à jour depuis OSM » de la
# page admin) passent l'un après l'autre : jamais deux commits concurrents.
concurrency:
  group: update-osm
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du projet
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation des dépendances
        run: |
          pip install requests pillow

      - name: Mise à jour des terrains
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          python scripts/update_terrains.py

      # Pages province et région régénérées avec les chiffres du jour (tuiles, intros, liste des
      # provinces) : sans cette étape, elles ne suivaient les données que lorsque le générateur
      # était relancé à la main. Aucun appel réseau, même résultat pour les mêmes données.
      # continue-on-error : si une commune citée dans une intro ({{NB:…}}) disparaît des données,
      # le générateur s'arrête ; les pages restent alors celles de la semaine précédente, et la
      # mise à jour OSM est sauvegardée quand même.
      - name: Pages province et région
        continue-on-error: true
        run: |
          python scripts/generate_provinces.py

      # Pistes voisines regroupées (notes, critères et avis valent pour tout le groupe, voir
      # grouper_terrains.py). Avant la promotion, qui s'en sert pour cumuler les votes.
      - name: Groupes de terrains voisins
        run: |
          python scripts/grouper_terrains.py

      # Critères d'environnement des terrains apparus depuis le dernier calcul (voir
      # environnement.yml pour le calcul complet). Un lot au plus, borné dans le temps, et
      # jamais bloquant pour la sauvegarde de la mise à jour OSM.
      - name: Critères d'environnement des nouveaux terrains
        continue-on-error: true
        timeout-minutes: 30
        run: |
          python scripts/enrichir_environnement.py --limite 250 --minutes 20

      # Promotion des terrains bien notés vers le carrousel : lit les votes sur le Worker
      # Cloudflare, reprend les miniatures 16:9 déjà dans le dépôt (faites par le workflow de
      # publication des photos), écrit data/terrains_promus.json.
      # continue-on-error : un souci de notation (Worker injoignable) ne doit JAMAIS empêcher la
      # sauvegarde de la mise à jour OSM à l'étape suivante.
      - name: Promotion des terrains bien notés
        continue-on-error: true
        run: |
          python scripts/promouvoir_terrains.py

      # Liste des terrains et candidats photo de la page admin : ajoute les nouveaux terrains
      # (avec leur candidat Mapillary), retire ceux disparus d'OSM, cherche de nouvelles pistes
      # pour les terrains « rien trouvé » (liste lue sur le Worker mapetanque-admin, d'où
      # JETON_WORKFLOW), renouvelle les liens des vignettes (temporaires, environ deux
      # semaines). Même règle que l'étape précédente : jamais bloquante pour la sauvegarde
      # de la mise à jour OSM.
      - name: Candidats photo de la page admin
        continue-on-error: true
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          JETON_WORKFLOW: ${{ secrets.JETON_WORKFLOW }}
        run: |
          python scripts/mettre_a_jour_candidats.py

      - name: Sauvegarde des changements
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # data/terrains_promus.json doit exister dans le dépôt AVANT le premier passage (même
          # vide : []) : git add échoue sur un chemin inexistant, et ferait échouer tout ce commit.
          # Même chose pour data/environnement.json (vide : {}).
          git add data/terrains.geojson data/environnement.json data/stats_geo.json data/terrains_promus.json data/candidats_photos.json data/terrains_apparition.json data/groupes_terrains.json
          git add province-*.html region-*.html nl/province-*.html nl/region-*.html de/province-*.html de/region-*.html en/province-*.html en/region-*.html sitemap.xml data/communes-*.json

          git commit -m "Mise à jour quotidienne OSM" || exit 0

          # Le workflow de publication des photos commite lui aussi : on se remet
          # à jour avant de pousser, sinon le push serait refusé.
          git pull --rebase
          git push
