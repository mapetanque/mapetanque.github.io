name: Mise à jour hebdomadaire des terrains OSM

on:
  schedule:
    - cron: "17 3 * * 1"

  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du projet
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation des dépendances
        run: |
          pip install requests

      - name: Mise à jour des terrains
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          python scripts/update_terrains.py

      - name: Sauvegarde des changements
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/terrains.geojson data/stats_geo.json

          git commit -m "Mise à jour quotidienne OSM" || exit 0

          git push