# Test des critères d'environnement (lecture seule).
#
# Lance scripts/tester_environnement.py sur les serveurs de GitHub et affiche les
# résultats dans le résumé de l'exécution. Rien n'est commité : le script ne modifie
# pas le site. Les réponses d'Overpass déjà reçues sont gardées d'une exécution à
# l'autre (actions/cache), pour reprendre là où un essai précédent s'est arrêté.
#
# Déclenché par un push qui modifie le script ou ce fichier, sur n'importe quelle
# branche (un workflow_dispatch n'est accepté que depuis la branche par défaut).

name: Test des critères d'environnement

on:
  push:
    paths:
      - "scripts/tester_environnement.py"
      - ".github/workflows/tester-environnement.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-environnement
  cancel-in-progress: true

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Récupération du projet
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install requests

      - name: Réponses Overpass déjà reçues
        uses: actions/cache/restore@v4
        with:
          path: cache_env
          key: overpass-env-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: overpass-env-

      - name: Test
        env:
          MAPETANQUE_CACHE_ENV: ${{ github.workspace }}/cache_env
        run: |
          set -o pipefail
          python -u scripts/tester_environnement.py | tee resultats.txt

      # Sauvegardé même en cas d'échec ou d'arrêt : l'essai suivant reprend où celui-ci s'est arrêté
      - name: Sauvegarde des réponses reçues
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache_env
          key: overpass-env-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Résumé
        if: always()
        run: |
          {
            echo '```'
            sed -n '/simples points/,$p' resultats.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Détail par terrain
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-environnement
          path: |
            resultats.txt
            cache_env/resultats_par_terrain.csv
          if-no-files-found: ignore
